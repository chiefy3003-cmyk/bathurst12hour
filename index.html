<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bathurst 12 Hour Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.4/photoswipe.min.css">
  <style>
    body { background: #0f1115; color: #f1f1f1; font-family: sans-serif; padding: 20px; text-align: center; }
    header { background: #181b20; padding: 30px; border-radius: 8px; margin-bottom: 20px; border-bottom: 3px solid #ffb703; }
    h1 { color: #ffb703; font-size: 5.25rem; text-transform: uppercase; margin: 0; letter-spacing: 2px; }
    .subtitle { color: #9aa0a6; margin-top: 10px; font-size: 1.1rem; }
    .campsite-btn { color: #39ff14; border: 1px solid #39ff14; padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; margin: 0 10px; display: inline-block; cursor: pointer; background: transparent; font-size: 1rem; }
    .campsite-btn:hover { background: rgba(57, 255, 20, 0.2); }
    .year-nav { margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .year-btn { background: #181b20; color: #f1f1f1; border: 1px solid #2a2e35; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
    .year-btn.active { background: #ffb703; color: #0f1115; font-weight: bold; }
    .data-card { background: #181b20; padding: 20px; border-radius: 8px; margin: 20px auto; border: 1px solid #2a2e35; max-width: 600px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-top: 20px; }
    .gallery a img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; border: 1px solid #2a2e35; cursor: pointer; }
    @media (max-width: 600px) { h1 { font-size: 2.5rem !important; } .gallery { grid-template-columns: 1fr !important; } }
  </style>
</head>
<body>

  <header>
    <h1>Bathurst 12 Hour 2027</h1>
    <p class="subtitle">
      <span style="color: #fff;">Event: Feb 11–14, 2027</span> 
      &nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp; 
      <a href="PADDOCK.pdf" target="_blank" class="campsite-btn" style="padding:5px 15px;">Paddock Campsites: 0798 & 0799</a> 
      &nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp; 
      <span style="color: #fff;">📍 Location: Bathurst, NSW</span> 
    </p>
  </header>

  <div class="countdown-container" style="background: #181b20; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: center; border: 1px solid #2a2e35;">
    <div style="color: #ffb703; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; font-weight: bold;">Next Race Countdown</div>
    <div id="timer" style="display: flex; justify-content: center; gap: 20px; font-size: 1.5rem; font-weight: 800; color: #fff;">
      <div><span id="days">00</span><div style="font-size: 0.6rem; color: #9aa0a6;">DAYS</div></div>
      <div><span id="hours">00</span><div style="font-size: 0.6rem; color: #9aa0a6;">HOURS</div></div>
      <div><span id="minutes">00</span><div style="font-size: 0.6rem; color: #9aa0a6;">MINS</div></div>
      <div><span id="seconds">00</span><div style="font-size: 0.6rem; color: #9aa0a6;">SECS</div></div>
    </div>
  </div>

  <div class="year-nav">
    <button class="year-btn" onclick="selectYear('2026')">2026</button>
    <button class="year-btn" onclick="selectYear('2025')">2025</button>
    <button class="year-btn" onclick="selectYear('2024')">2024</button>
    <button class="year-btn" onclick="selectYear('2023')">2023</button>
    <button class="year-btn" onclick="selectYear('2022')">2022</button>
  </div>
  <div id="resultsDisplay" class="data-card">Select a year to see results.</div>

  <button onclick="toggleGallery()" class="campsite-btn" style="margin-top: 30px;">View Photo Gallery</button>

  <div id="gallerySection" class="gallery" style="display: none;">
    <a href="IMG-20260213-WA0001(1).jpg" data-pswp-width="1200" data-pswp-height="800"><img src="IMG-20260213-WA0001(1).jpg" alt="Photo 1"></a>
    <a href="IMG-20240601-WA0004.jpg" data-pswp-width="1200" data-pswp-height="800"><img src="IMG-20240601-WA0004.jpg" alt="Photo 2"></a>
    <a href="IMG-20260215-WA0007.jpg" data-pswp-width="1200" data-pswp-height="800"><img src="IMG-20260215-WA0007.jpg" alt="Photo 3"></a>
    <a href="IMG-20260214-WA0005.jpg" data-pswp-width="1200" data-pswp-height="800"><img src="IMG-20260214-WA0005.jpg" alt="Photo 4"></a>
  </div>

  <script type="module">
    import PhotoSwipeLightbox from 'https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.4/photoswipe-lightbox.esm.min.js';
    const lightbox = new PhotoSwipeLightbox({ gallery: '#my-gallery', children: 'a', pswpModule: () => import('https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.4/photoswipe.esm.min.js') });
    lightbox.init();
  </script>
  <script>
    function toggleGallery() { var x = document.getElementById("gallerySection"); x.style.display = (x.style.display === "none") ? "grid" : "none"; }
    function selectYear(year) {
      const raceData = {
        "2026": { results: "Winner: #888 Mercedes-AMG (Engel/Grenier/Martin)", pole: "1:25.800", fastLap: "2:02.100" },
        "2025": { results: "Winner: #32 Team WRT BMW (K.vdLinde/S.vdLinde/Farfus)", pole: "1:26.100", fastLap: "2:02.500" },
        "2024": { results: "Winner: #75 SunEnergy1 Mercedes (Gounon/Stolz/Habul)", pole: "1:26.272", fastLap: "2:02.189" },
        "2023": { results: "Winner: #75 SunEnergy1 Mercedes (Gounon/Stolz/Habul)", pole: "1:25.692", fastLap: "2:01.981" },
        "2022": { results: "Winner: #75 SunEnergy1 Mercedes (Gounon/Habul/Stolz/Martin)", pole: "2:02.978", fastLap: "2:03.312" }
      };
      const data = raceData[year];
      document.getElementById('resultsDisplay').innerHTML = `<h3>${year} Results</h3><p>${data.results}</p><p>Pole: ${data.pole}</p><p>Fastest Lap: ${data.fastLap}</p>`;
    }
    function updateCountdown() {
      const raceDate = new Date("2027-02-14T05:45:00+11:00").getTime();
      const now = new Date().getTime();
      const distance = raceDate - now;
      document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
      document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
      document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
      document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
