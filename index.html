<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bathurst 12 Hour Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/css/lightgallery-bundle.min.css">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0f1115;
      --panel: #181b20;
      --panel-2: #1d2127;
      --panel-3: #242a30;
      --accent: #ffb703;
      --accent-2: #39ff14;
      --text: #f1f1f1;
      --muted: #9aa0a6;
      --danger: #e10600;
      --shadow: rgba(0, 0, 0, 0.35);
    }
    body {
      background:
        radial-gradient(circle at top, rgba(255,183,3,0.08), transparent 35%),
        linear-gradient(180deg, #0b0d10 0%, var(--bg) 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      padding: 24px 20px 60px;
      text-align: center;
      margin: 0;
      min-height: 100vh;
    }
    .page-shell {
      max-width: 1200px;
      margin: 0 auto;
    }
    a { text-decoration: none; }
    button {
      font: inherit;
    }
    header {
      display: block;
      background: linear-gradient(135deg, rgba(24,27,32,0.96), rgba(35,40,46,0.96));
      padding: 30px 32px 28px;
      border-radius: 14px;
      margin-bottom: 22px;
      border: 1px solid rgba(255,183,3,0.25);
      box-shadow: 0 18px 40px var(--shadow);
      text-align: center;
    }
    h1 {
      color: var(--accent);
      font-size: clamp(2.8rem, 7vw, 5.25rem);
      text-transform: uppercase;
      margin: 0;
      letter-spacing: 3px;
      line-height: 1.05;
      text-shadow: 0 0 22px rgba(255,183,3,0.15);
    }
    .brand-logo {
      display: block;
      width: min(100%, 320px);
      margin: 0 auto 18px;
      padding: 0;
      line-height: 0;
      font-size: 0;
      letter-spacing: 0;
      text-shadow: none;
    }
    .brand-logo img {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,0.28));
    }
    .subtitle {
      color: #fff;
      margin: 0;
      font-size: 1rem;
      line-height: 1.5;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1fr);
      justify-items: center;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 84px;
      padding: 16px 20px;
      background: rgba(15,17,21,0.45);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
    }
    .subtitle .campsite-btn {
      margin: 0;
      padding: 9px 16px;
      font-size: 0.95rem;
      text-align: center;
      white-space: nowrap;
    }
    .campsite-btn {
      color: var(--accent-2);
      border: 1px solid var(--accent-2);
      padding: 10px 20px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: bold;
      margin: 0 10px;
      display: inline-block;
      cursor: pointer;
      background: rgba(57,255,20,0.04);
      font-size: 1rem;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      box-shadow: inset 0 0 0 1px rgba(57,255,20,0.1);
    }
    .campsite-btn:hover {
      background: rgba(57,255,20,0.12);
      transform: translateY(-1px);
      box-shadow: 0 10px 25px rgba(57,255,20,0.12);
    }
    .year-nav {
      margin: 22px 0 18px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .year-btn {
      background: rgba(24,27,32,0.9);
      color: var(--text);
      border: 1px solid rgba(57,255,20,0.8);
      padding: 10px 18px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.25s ease;
      font-weight: 600;
    }
    .year-btn:hover {
      background: var(--accent-2);
      color: var(--bg);
      transform: translateY(-1px);
    }
    .year-btn.active {
      background: linear-gradient(135deg, var(--accent-2), #8eff7d);
      color: var(--bg);
      font-weight: bold;
      border-color: transparent;
      box-shadow: 0 10px 20px rgba(57,255,20,0.18);
    }
    .data-card {
      background: linear-gradient(180deg, rgba(24,27,32,0.96), rgba(29,33,39,0.96));
      padding: 20px;
      border-radius: 12px;
      margin: 20px auto;
      border: 1px solid rgba(255,255,255,0.07);
      max-width: 700px;
      box-shadow: 0 16px 30px rgba(0,0,0,0.18);
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 15px;
      margin-top: 22px;
    }
    .gallery a img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      display: block;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 24px rgba(0,0,0,0.18);
    }
    .gallery a img:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 30px rgba(0,0,0,0.2);
    }
    .countdown-container {
      background: linear-gradient(180deg, rgba(24,27,32,0.96), rgba(29,33,39,0.96));
      padding: 24px 16px 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 18px 30px rgba(0,0,0,0.12);
    }
    .countdown-container .title {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .countdown-grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
      flex-wrap: wrap;
    }
    .countdown-cell {
      min-width: 84px;
    }
    .countdown-cell .label {
      font-size: 0.6rem;
      color: var(--muted);
      margin-top: 2px;
      letter-spacing: 0.12em;
    }
    .poll-buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      max-width: 620px;
      margin: 8px auto 20px;
    }
    .poll-button {
      background: linear-gradient(135deg, var(--danger), #ff3d3d);
      color: white;
      border: none;
      padding: 26px 60px;
      font-size: clamp(1.5rem, 2.8vw, 2rem);
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      margin: 0;
      width: 100%;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 16px 30px rgba(225, 6, 0, 0.28);
    }
    .poll-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 20px 34px rgba(225, 6, 0, 0.32);
    }
    .modal-backdrop {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(0,0,0,0.82);
      padding: 20px;
      overflow-y: auto;
    }
    .modal-backdrop.open {
      display: block;
    }
    .modal-card {
      background: linear-gradient(180deg, rgba(24,27,32,1), rgba(29,33,39,1));
      margin: 4vh auto;
      padding: 22px;
      width: min(100%, 460px);
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 12px;
      border: 1px solid rgba(255,183,3,0.35);
      box-shadow: 0 22px 40px rgba(0,0,0,0.35);
    }
    .modal-card h3 {
      color: var(--accent);
      margin-top: 0;
      margin-bottom: 18px;
    }
    .vote-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .vote-option {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
    }
    .vote-option button {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(15,17,21,0.9);
      color: var(--text);
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
      text-align: left;
    }
    .vote-option button:hover:not(:disabled) {
      background: rgba(57,255,20,0.08);
      border-color: rgba(57,255,20,0.6);
    }
    .vote-option button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .vote-count {
      min-width: 76px;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
    }
    .poll-status {
      min-height: 1.4em;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .poll-status.error {
      color: #ff8585;
    }
    @media (max-width: 760px) {
      header {
        padding: 24px 16px 18px;
        text-align: center;
      }
      .brand-logo {
        width: min(100%, 280px);
      }
      .subtitle {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 14px 12px;
      }
      .subtitle .campsite-btn {
        white-space: normal;
      }
      .gallery {
        grid-template-columns: 1fr;
      }
      body {
        padding-inline: 14px;
      }
      .poll-buttons {
        gap: 10px;
      }
      .poll-button {
        padding: 20px 10px;
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header>
      <h1 class="brand-logo"><img src="B12HR_MAG_POS_LOCKUP_WIDE_TRANSPARENT.webp" alt="Bathurst 12 Hour"></h1>
      <p class="subtitle" aria-label="Event information">
        <span style="color: #fff;">Event: Feb 11–14, 2027</span>
        <a href="PADDOCK.pdf" target="_blank" rel="noopener noreferrer" class="campsite-btn">Paddock Campsites: 0798 &amp; 0799</a>
        <span style="color: #fff;">📍 Location: Bathurst, NSW</span>
      </p>
    </header>

    <div class="countdown-container">
      <div class="title">Next Race Countdown</div>
      <div id="timer" class="countdown-grid">
        <div class="countdown-cell"><span id="days">00</span><div class="label">DAYS</div></div>
        <div class="countdown-cell"><span id="hours">00</span><div class="label">HOURS</div></div>
        <div class="countdown-cell"><span id="minutes">00</span><div class="label">MINS</div></div>
        <div class="countdown-cell"><span id="seconds">00</span><div class="label">SECS</div></div>
      </div>
    </div>

    <div class="poll-buttons" aria-label="Community polls">
      <button type="button" class="poll-button" onclick="openPollModal('firstFailure', this);">POLL #1</button>
      <button type="button" class="poll-button" onclick="openPollModal('winningManufacturer', this);">POLL #2</button>
    </div>

    <div id="pollModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="pollTitle" aria-hidden="true">
      <div class="modal-card">
        <h3 id="pollTitle"></h3>
        <div id="pollOptions" class="vote-group"></div>
        <p id="pollStatus" class="poll-status" aria-live="polite"></p>
        <button type="button" onclick="closePollModal();" style="margin-top:20px;">Close</button>
      </div>
    </div>

    <div class="year-nav" aria-label="Select a year">
      <button type="button" class="year-btn active" onclick="selectYear('2026', this)">2026</button>
      <button type="button" class="year-btn" onclick="selectYear('2025', this)">2025</button>
      <button type="button" class="year-btn" onclick="selectYear('2024', this)">2024</button>
      <button type="button" class="year-btn" onclick="selectYear('2023', this)">2023</button>
      <button type="button" class="year-btn" onclick="selectYear('2022', this)">2022</button>
    </div>
    <div id="resultsDisplay" class="data-card" aria-live="polite"><h3>2026 Results</h3><p>Winner: #888 Mercedes-AMG (Engel/Grenier/Martin)</p><p>Pole: 1:25.800</p><p>Fastest Lap: 2:02.100</p></div>

    <button type="button" onclick="toggleGallery()" class="campsite-btn" aria-expanded="false" aria-controls="gallerySection" style="margin-top: 30px;">View Photo Gallery</button>

    <div id="gallerySection" class="gallery" style="display: none;">
      <a href="IMG-20260213-WA0001(1).jpg"><img src="IMG-20260213-WA0001(1).jpg" alt="Photo 1"></a>
      <a href="IMG-20240601-WA0004.jpg"><img src="IMG-20240601-WA0004.jpg" alt="Photo 2"></a>
      <a href="IMG-20260215-WA0007.jpg"><img src="IMG-20260215-WA0007.jpg" alt="Photo 3"></a>
      <a href="IMG-20260214-WA0005.jpg"><img src="IMG-20260214-WA0005.jpg" alt="Photo 4"></a>
      <a href="timthumb.jpg"><img src="timthumb.jpg" alt="Photo 5"></a>
      <a href="timthumb (3).jpg"><img src="timthumb (3).jpg" alt="Photo 6"></a>
      <a href="timthumb (2).jpg"><img src="timthumb (2).jpg" alt="Photo 7"></a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/lightgallery.min.js"></script>
  <script>
    const pollModal = document.getElementById('pollModal');
    const pollTitle = document.getElementById('pollTitle');
    const pollOptions = document.getElementById('pollOptions');
    const pollStatus = document.getElementById('pollStatus');
    const gallerySection = document.getElementById('gallerySection');
    const galleryToggle = document.querySelector('.campsite-btn[aria-controls="gallerySection"]');
    const supabaseUrl = 'https://pmnrycyixhbujlffdxpk.supabase.co';
    const supabasePublicKey = 'sb_publishable_NpgAZaJME73H8iNv73E6qg_ne7vBxgd';
    const pollDefinitions = {
      firstFailure: {
        id: 'first-failure',
        title: 'What will fail first?',
        options: ["Will's back", "Mick's knee", "Ross' fridge", 'Flag pole']
      },
      winningManufacturer: {
        id: 'winning-manufacturer',
        title: 'Winning Manufacturer',
        options: ['Ford', 'Chev', 'Porsche', 'Mercedes', 'BMW', 'Audi', 'KTM', 'Ferrari', 'Lambo']
      }
    };
    let activePollKey = null;
    let activePollTrigger = null;
    let voteCounts = {};
    let voteCountsLoaded = false;
    let voteSubmitting = false;
    let pollRefreshTimer = null;
    let supabaseClient = null;

    function isSupabaseConfigured() {
      return supabaseUrl.startsWith('https://')
        && !supabaseUrl.includes('YOUR_PROJECT_ID')
        && supabasePublicKey.length > 0
        && !supabasePublicKey.includes('YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY');
    }

    function getSupabaseClient() {
      if (!isSupabaseConfigured() || !window.supabase?.createClient) return null;
      supabaseClient ??= window.supabase.createClient(supabaseUrl, supabasePublicKey);
      return supabaseClient;
    }

    function setPollStatus(message, isError = false) {
      pollStatus.textContent = message;
      pollStatus.classList.toggle('error', isError);
    }

    function renderPollOptions() {
      const poll = pollDefinitions[activePollKey];
      if (!poll) return;

      pollOptions.replaceChildren();
      for (const option of poll.options) {
        const row = document.createElement('div');
        row.className = 'vote-option';

        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = option;
        button.disabled = !getSupabaseClient() || voteSubmitting;
        button.addEventListener('click', () => submitPollVote(option));

        const count = document.createElement('span');
        count.className = 'vote-count';
        const optionCount = voteCounts[poll.id]?.[option] ?? 0;
        count.textContent = voteCountsLoaded
          ? `${optionCount} ${optionCount === 1 ? 'vote' : 'votes'}`
          : '— votes';

        row.append(button, count);
        pollOptions.append(row);
      }
    }

    async function refreshPollCounts(afterVote = false) {
      const client = getSupabaseClient();
      if (!client) {
        const message = isSupabaseConfigured()
          ? 'Supabase client library did not load. Check your internet connection and reload.'
          : 'Shared voting is not configured. Add your Supabase project URL and public key in this page.';
        setPollStatus(message, true);
        return false;
      }

      try {
        const { data: rows, error } = await client
          .from('poll_vote_counts')
          .select('poll_id, option_text, vote_count');
        if (error) throw new Error(error.message);
        const nextCounts = {};
        for (const row of rows) {
          nextCounts[row.poll_id] ??= {};
          nextCounts[row.poll_id][row.option_text] = Number(row.vote_count);
        }
        voteCounts = nextCounts;
        voteCountsLoaded = true;
        renderPollOptions();
        setPollStatus(afterVote ? 'Your vote was counted. Totals are up to date.' : 'Shared totals loaded.');
        return true;
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        setPollStatus(
          `${afterVote ? 'Vote recorded, but totals could not be refreshed' : 'Could not load shared vote totals'}: ${message}`,
          true
        );
        return false;
      }
    }

    async function openPollModal(pollKey, trigger) {
      const poll = pollDefinitions[pollKey];
      if (!poll) return;

      if (pollRefreshTimer) clearInterval(pollRefreshTimer);
      activePollKey = pollKey;
      activePollTrigger = trigger;
      pollTitle.textContent = poll.title;
      pollModal.classList.add('open');
      pollModal.setAttribute('aria-hidden', 'false');
      renderPollOptions();

      if (!getSupabaseClient()) {
        setPollStatus(
          isSupabaseConfigured()
            ? 'Supabase client library did not load. Check your internet connection and reload.'
            : 'Shared voting is not configured. Add your Supabase project URL and public key in this page.',
          true
        );
        return;
      }

      pollRefreshTimer = setInterval(() => {
        if (pollModal.classList.contains('open') && !voteSubmitting) {
          refreshPollCounts();
        }
      }, 15000);
      setPollStatus('Loading shared vote totals…');
      await refreshPollCounts();
    }

    function closePollModal() {
      pollModal.classList.remove('open');
      pollModal.setAttribute('aria-hidden', 'true');
      if (pollRefreshTimer) {
        clearInterval(pollRefreshTimer);
        pollRefreshTimer = null;
      }
      if (activePollTrigger) activePollTrigger.focus();
    }

    async function submitPollVote(option) {
      const poll = pollDefinitions[activePollKey];
      const client = getSupabaseClient();
      if (!poll || !poll.options.includes(option) || !client || voteSubmitting) return;

      voteSubmitting = true;
      renderPollOptions();
      setPollStatus('Submitting your vote…');
      try {
        const { error } = await client.from('poll_votes').insert({
          poll_id: poll.id,
          option_text: option
        });
        if (error) throw new Error(error.message);
        await refreshPollCounts(true);
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        setPollStatus(`Could not submit your vote: ${message}`, true);
      } finally {
        voteSubmitting = false;
        renderPollOptions();
      }
    }

    function toggleGallery() {
      const isHidden = gallerySection.style.display === 'none';
      gallerySection.style.display = isHidden ? 'grid' : 'none';
      galleryToggle.setAttribute('aria-expanded', String(isHidden));
      galleryToggle.textContent = isHidden ? 'Hide Photo Gallery' : 'View Photo Gallery';
    }

    lightGallery(gallerySection, { selector: 'a' });

    function selectYear(year, btn) {
      document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const raceData = {
        '2026': { results: 'Winner: #888 Mercedes-AMG (Engel/Grenier/Martin)', pole: '1:25.800', fastLap: '2:02.100' },
        '2025': { results: 'Winner: #32 Team WRT BMW (K.vdLinde/S.vdLinde/Farfus)', pole: '1:26.100', fastLap: '2:02.500' },
        '2024': { results: 'Winner: #75 SunEnergy1 Mercedes (Gounon/Stolz/Habul)', pole: '1:26.272', fastLap: '2:02.189' },
        '2023': { results: 'Winner: #75 SunEnergy1 Mercedes (Gounon/Stolz/Habul)', pole: '1:25.692', fastLap: '2:01.981' },
        '2022': { results: 'Winner: #75 SunEnergy1 Mercedes (Gounon/Habul/Stolz/Martin)', pole: '2:02.978', fastLap: '2:03.312' }
      };
      const data = raceData[year];
      document.getElementById('resultsDisplay').innerHTML = `<h3>${year} Results</h3><p>${data.results}</p><p>Pole: ${data.pole}</p><p>Fastest Lap: ${data.fastLap}</p>`;
    }

    function updateCountdown() {
      const raceDate = new Date('2027-02-14T05:45:00+11:00').getTime();
      const now = new Date().getTime();
      const distance = raceDate - now;
      if (distance < 0) {
        document.querySelector('.countdown-container').innerHTML = 'Race Underway!';
        return;
      }
      document.getElementById('days').innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
      document.getElementById('hours').innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
      document.getElementById('minutes').innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
      document.getElementById('seconds').innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
    }

    document.getElementById('pollModal').addEventListener('click', function(event) {
      if (event.target === pollModal) {
        closePollModal();
      }
    });

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        closePollModal();
      }
    });

    selectYear('2026', document.querySelector('.year-btn.active'));
    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
